<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Access Denied - $gatewayname</title>
	<link rel="stylesheet" href="splash.css">
</head>
<body>
	<div class="container">
		<div class="card">
			<header class="card-header">
				<h1>$gatewayname</h1>
				<p class="subtitle">Access Denied</p>
			</header>

			<div class="card-body">
				<div class="blocked-message" role="alert" aria-live="assertive">
					<p>You are <strong>BLOCKED</strong> from connecting this WiFi. You have been warned and you somehow did something <strong>WRONG</strong>!</p>
				</div>

				<div class="stats-section">
					<span class="stat-badge">$nclients active users</span>
				</div>
			</div>

			<footer class="card-footer">
				<p class="muted">If you believe this is an error, please contact the network administrator.</p>
			</footer>
		</div>
	</div>
</body>
</html>
